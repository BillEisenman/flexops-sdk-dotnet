name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Build and contract check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - run: dotnet build FlexOps.Sdk.csproj --configuration Release -p:TreatWarningsAsErrors=true
      - run: dotnet run --project tests/FlexOps.Sdk.ContractCheck --configuration Release
