name: Publish to NuGet

# Publishes FlexOps.Sdk to nuget.org via trusted publishing (OIDC) — no stored
# API key. Triggered on vX.Y.Z tag push or manual workflow_dispatch.
#
# One-time setup on nuget.org (required before the first run):
#   1. Sign in as 'fasttrak' → account menu → Trusted Publishing → Add
#   2. Package owner:     fasttrak
#      Repository owner:  BillEisenman
#      Repository:        flexops-sdk-dotnet
#      Workflow file:     publish.yml
#      Environment:       (leave blank)
#
# Docs: https://learn.microsoft.com/nuget/nuget-org/trusted-publishing

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # mints the OIDC token GitHub exchanges for a short-lived NuGet key

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: |
          dotnet restore FlexOps.Sdk.csproj
          dotnet restore tests/FlexOps.Sdk.ContractCheck/FlexOps.Sdk.ContractCheck.csproj

      - name: Build
        run: dotnet build FlexOps.Sdk.csproj --configuration Release --no-restore

      - name: Check rate-shopping contract
        run: dotnet run --project tests/FlexOps.Sdk.ContractCheck --configuration Release --no-restore

      - name: Pack
        run: dotnet pack FlexOps.Sdk.csproj --configuration Release --no-build --output ./artifacts

      - name: NuGet login (OIDC → short-lived key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: fasttrak

      - name: Publish
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
